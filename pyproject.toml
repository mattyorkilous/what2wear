[project]
name = "what2wear"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Matt Yorkilous", email = "matt_yorkilous@yahoo.com" }
]
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "holidays>=0.105",
    "platformdirs>=4.11.3",
]

[project.scripts]
what2wear = "what2wear.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import the package from the source tree rather than the installed
# copy, so the suite runs the same whether or not the project has
# been installed.
pythonpath = ["src"]

[tool.ruff]
line-length = 72

[tool.ruff.lint]
select = ["ALL"]
# What ALL asks for that this repo has already decided against. Each
# line is a standing decision, not a backlog.
ignore = [
    # Formatter conflicts -- ruff format owns this.
    "COM812",
    # A type used only in annotations still reads better at the top
    # of the file than inside a TYPE_CHECKING block, whether it comes
    # from the stdlib or from `model.py`.
    "TC001",
    "TC003",
    # Not a distributed work -- no per-file copyright headers.
    "CPY001",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# The CLI is the one place that prints, and its two matches carry
# one arm per subcommand (ADR-0009).
"src/what2wear/cli.py" = ["T201", "PLR0911"]

# Tests assert, are not a package, and say 2 when they mean exit 2.
# A test's name is its documentation, so no docstring per case.
"tests/*" = [
    "S101",
    "INP001",
    "PLR0913",
    "PLR0917",
    "PLR2004",
    "D100",
    "D101",
    "D102",
    "D103",
]

[tool.ty.src]
# Prototypes are throwaway: they answer a question and are not kept in
# step with the package.
exclude = [".scratch"]

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
    "ty>=0.0.82",
]
