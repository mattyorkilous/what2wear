{% extends "base.html" %}
{% block content %}
<h1>Settings</h1>
<form method="post" action="{{ url_for('save_office_weekdays') }}">
  <fieldset>
    <legend>Office Weekdays</legend>
    {% for weekday in weekdays %}<label><input type="checkbox" name="weekday" value="{{ loop.index0 }}"{% if loop.index0 in office_weekdays %} checked{% endif %}> {{ weekday.title() }}</label>
    {% endfor %}
    <p class="note">Tick exactly three.</p>
  </fieldset>
  <button>Save</button>
</form>
<form method="post" action="{{ url_for('save_cold_threshold') }}">
  <label>Cold Threshold
    <input type="number" step="any" name="threshold" value="{{ threshold }}" required> °F
  </label>
  <button>Save</button>
</form>
{% endblock %}
