{% extends "base.html" %}
{% set page = "settings" %}
{% block content %}
<h1>Settings</h1>
<h2>Office Weekdays</h2>
<form class="weekdays" method="post" action="{{ url_for('save_office_weekdays') }}">
  <div class="chips">
    {% for weekday in weekdays %}<label><input type="checkbox" name="weekday" value="{{ loop.index0 }}"{% if loop.index0 in office_weekdays %} checked{% endif %} aria-label="{{ weekday.title() }}"><span>{{ weekday[0] | upper }}</span></label>
    {% endfor %}
  </div>
  <p class="note countdown" aria-live="polite"></p>
  <button class="save">Save</button>
</form>
<p class="footnote">Changing these keeps every Rotation where it is.</p>
<h2>Cold Threshold</h2>
<form class="threshold" data-stored="{{ stored_threshold }}" method="post" action="{{ url_for('save_cold_threshold') }}">
  <div class="stepper">
    <button type="button" data-step="-1" aria-label="One degree colder">−</button>
    <label><input type="number" name="threshold" value="{{ threshold }}" min="{{ thresholds[0] }}" max="{{ thresholds[-1] }}" step="1" inputmode="numeric" required aria-label="Cold Threshold">°F</label>
    <button type="button" data-step="1" aria-label="One degree warmer">+</button>
  </div>
  <button class="save">Save</button>
</form>
{% endblock %}
