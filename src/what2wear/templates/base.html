<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="color-scheme" content="light dark">
  <title>what2wear</title>
  <script>document.documentElement.classList.add("js");</script>
  <style>
    :root { --bg: #fff; --card: #f2f2f7; --raised: #fff; --label: #000;
            --secondary: rgba(60, 60, 67, .6); --bar: rgba(255, 255, 255, .8);
            --shadow: 0 3px 8px rgba(0, 0, 0, .12); --red: #ff3b30;
            --bar-height: calc(48px + env(safe-area-inset-top));
            --toolbar-space: calc(88px + env(safe-area-inset-bottom)); }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #000; --card: #1c1c1e; --raised: #2c2c2e; --label: #fff;
              --secondary: rgba(235, 235, 245, .6); --bar: rgba(0, 0, 0, .8);
              --shadow: none; --red: #ff453a; }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; background: var(--bg); color: var(--label);
           font: 17px/1.3 system-ui, -apple-system, sans-serif;
           -webkit-font-smoothing: antialiased; }
    main { max-width: 40rem; margin: 0 auto; padding: 0 16px 32px; }
    main:has(.day) { padding-bottom: var(--toolbar-space); }
    a { color: inherit; text-decoration: none; }
    h1 { font-size: 40px; line-height: 1.05; font-weight: 800;
         letter-spacing: -.02em; margin: 20px 0; }
    h2, legend { font-size: 22px; font-weight: 700; margin: 28px 0 8px; padding: 0; }
    .eyebrow { font-size: 13px; font-weight: 600; letter-spacing: .02em;
               text-transform: uppercase; color: var(--secondary); margin: 16px 4px 6px; }
    .caption { color: var(--secondary); font-size: 15px; margin: -12px 4px 12px; }
    .note { color: var(--secondary); font-size: 15px; }
    main > form, main > ul, fieldset { background: var(--card); border: 0;
                                       border-radius: 22px; padding: 16px 18px; margin: 12px 0; }
    main > ul { list-style: none; }
    main > ul > li + li { margin-top: 12px; }
    fieldset { padding: 0; min-width: 0; }
    label { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    input, select, button { font: inherit; color: inherit; }
    input:not([type=checkbox]):not([type=color]), select {
      background: var(--bg); border: 0; border-radius: 12px; padding: 10px 14px; }
    input[type=checkbox] { accent-color: var(--label); width: 22px; height: 22px; }
    button { appearance: none; border: 0; border-radius: 999px; cursor: pointer;
             background: var(--label); color: var(--bg); font-weight: 600; padding: 12px 20px; }

    .bar { position: sticky; top: 0; z-index: 2; background: var(--bar);
           -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
           padding: calc(8px + env(safe-area-inset-top)) 16px 8px; }
    .segments { display: flex; max-width: 40rem; margin: 0 auto; padding: 2px;
                background: var(--card); border-radius: 9px; }
    .segments a { flex: 1; text-align: center; font-size: 13px; font-weight: 600;
                  padding: 6px 0; border-radius: 7px; }
    .segments a[aria-current] { background: var(--raised); box-shadow: var(--shadow); }
    .toast { width: fit-content; max-width: calc(100% - 32px); margin: 12px auto 0;
             padding: 10px 18px; border-radius: 999px; text-align: center;
             background: var(--label); color: var(--bg); font-size: 15px; font-weight: 600;
             transition: opacity .4s ease-out; }
    .js .toast { position: absolute; left: 0; right: 0; top: 100%; margin-top: 8px;
                 box-shadow: 0 6px 24px rgba(0, 0, 0, .18); }
    .toast.gone { opacity: 0; }

    [popover] { border: 0; padding: 6px; margin: 0; color: var(--label);
                background: var(--raised); box-shadow: 0 10px 40px rgba(0, 0, 0, .25); }
    [popover]::backdrop { background: rgba(0, 0, 0, .35); }
    .menu { position: fixed; inset: auto 16px calc(84px + env(safe-area-inset-bottom)) auto;
            width: 270px; border-radius: 16px; }
    .menu form { margin: 0; }
    .menu button { display: block; width: 100%; text-align: left; border-radius: 10px;
                   background: none; color: var(--label); font-weight: 500; padding: 12px 14px; }
    .sheet { position: fixed; inset: auto 0 0; width: auto; max-width: 40rem;
             max-height: 85svh; overflow: auto; margin: 0 auto; border-radius: 22px 22px 0 0;
             background: var(--bg); padding: 8px 16px calc(24px + env(safe-area-inset-bottom)); }
    .sheet::before { content: ""; display: block; width: 36px; height: 5px; border-radius: 3px;
                     background: var(--secondary); opacity: .5; margin: 0 auto 4px; }
    .sheet h2 { margin-top: 12px; }

    .day { display: flex; flex-direction: column; touch-action: pan-y;
           -webkit-user-select: none; user-select: none;
           height: calc(100svh - var(--bar-height) - var(--toolbar-space)); }
    .day h1 { margin: 12px 0; }
    .day .caption { margin-top: -4px; }
    .day svg { pointer-events: none; }
    .week { display: flex; margin-top: 10px; }
    .week a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; }
    .week small { font-size: 12px; font-weight: 600; color: var(--secondary); }
    .week b { width: 34px; height: 34px; border-radius: 50%; font-size: 19px; font-weight: 700;
              display: flex; align-items: center; justify-content: center; }
    .week i { font-style: normal; font-size: 11px; font-weight: 700; color: var(--secondary); }
    .week .today b { color: var(--red); }
    .week [aria-current] b { background: var(--label); color: var(--bg); }
    .week .today[aria-current] b { background: var(--red); color: #fff; }
    .outfit { list-style: none; margin: 0; padding: 0; min-height: 0;
              display: flex; flex-direction: column; gap: 8px; flex: var(--rows) 1 0; }
    .outfit li { flex: 1 1 0; min-height: 44px; container-type: size;
                 display: flex; align-items: center; gap: 16px;
                 background: var(--card); border-radius: 22px; padding: 4px 18px 4px 6px; }
    .outfit li.shirt { flex-grow: 1.3; }
    .outfit svg { height: min(150px, 92cqh); width: auto; aspect-ratio: 1; flex: none; }
    .outfit b { display: block; font-size: 22px; font-weight: 800; }
    .outfit small { color: var(--secondary); font-size: 15px; font-weight: 600; }
    .day .eyebrow { margin-top: 14px; }
    .snap { transition: transform .22s ease-out, opacity .22s ease-out; }
    .from-right { animation: from-right .25s ease-out; }
    .from-left { animation: from-left .25s ease-out; }
    @keyframes from-right { from { transform: translateX(40%); opacity: 0; } }
    @keyframes from-left { from { transform: translateX(-40%); opacity: 0; } }

    .toolbar { position: fixed; left: 16px; right: 16px; z-index: 2; bottom: calc(16px + env(safe-area-inset-bottom));
               max-width: 40rem; margin: 0 auto; display: flex; align-items: center; gap: 6px; padding: 6px;
               border-radius: 999px; background: var(--bar); box-shadow: 0 6px 24px rgba(0, 0, 0, .18);
               -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
    .toolbar form { flex: 1; display: flex; justify-content: center; gap: 6px; margin: 0; }
    .toolbar label { position: relative; font-weight: 700; padding: 10px 12px; }
    .js .toolbar input[type=date] { position: absolute; inset: 0; width: 100%; height: 100%;
                                    opacity: 0; padding: 0; cursor: pointer; }
    html:not(.js) .toolbar label span { display: none; }
    .toolbar a, .toolbar .more { border-radius: 999px; background: var(--card); color: var(--label);
                                 font-size: 15px; font-weight: 600; padding: 12px 16px; }
    .toolbar .more { font-size: 20px; line-height: 20px; }
    .shirts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0; }
    .shirts button { display: flex; flex-direction: column; align-items: center; gap: 2px;
                     background: var(--card); color: var(--label); border-radius: 18px;
                     padding: 8px 4px 10px; font-size: 13px; }
    .shirts button[aria-current] { outline: 3px solid var(--label); outline-offset: -3px; }
    .shirts svg { width: 64px; height: 64px; }

    .symbols { position: absolute; }
    .tiles { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
    .tiles > button { width: calc((100% - 16px) / 3); display: flex; flex-direction: column;
                      align-items: center; min-width: 0; background: var(--card); color: var(--label);
                      border-radius: 20px; padding: 6px 4px 10px; font-weight: 700; font-size: 15px; }
    .tiles.four > button { width: calc((100% - 24px) / 4); font-size: 13px; padding: 4px 2px 8px; }
    .tiles svg { width: 100%; height: auto; max-width: 92px; aspect-ratio: 1; }
    .tiles b { line-height: 1.15; }
    .tiles small { font-size: 12px; font-weight: 600; color: var(--secondary); margin-top: 2px; }
    .tiles small.today { color: var(--red); }
    .sheet-head { display: flex; align-items: center; gap: 14px; }
    .sheet-head svg { flex: none; }
    .sheet-head h2 { margin: 0; font-size: 26px; font-weight: 800; }
    .sheet .eyebrow { margin-top: 18px; }
    .sheet .shirts { grid-template-columns: repeat(4, 1fr); }
    .capsule { display: inline-block; margin-top: 12px; border-radius: 999px; background: var(--card);
               font-size: 15px; font-weight: 700; padding: 10px 16px; }
    .rows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .rows li { display: flex; align-items: center; gap: 14px; background: var(--card);
               border-radius: 20px; padding: 4px 16px 4px 4px; }
    .rows svg { flex: none; }
    .rows b { display: block; font-size: 19px; font-weight: 800; }
    .rows small { color: var(--secondary); font-size: 14px; font-weight: 600; }
    button.wide, .replace > button { display: block; width: 100%; margin-top: 16px; }
    .preview { display: flex; justify-content: center; }
    .replace h2 { text-align: center; margin-top: 4px; }
    .fields { background: var(--card); border-radius: 18px; padding: 2px 16px; }
    .fields label { display: flex; justify-content: space-between; flex-wrap: nowrap; padding: 10px 0;
                    font-weight: 600; }
    .fields label + label { border-top: .5px solid var(--secondary); }
    .fields input[name=label] { background: none; text-align: right; padding: 0; min-width: 0;
                                width: 60%; color: var(--secondary); }
    .fields input[type=color] { width: 44px; height: 30px; border: 0; padding: 0; background: none; }

    .footnote { color: var(--secondary); font-size: 13px; margin: -4px 4px 0; }
    .chips { display: flex; justify-content: space-between; gap: 4px; }
    .chips label { position: relative; }
    .chips input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
    .chips span { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center;
                  justify-content: center; font-weight: 700; box-shadow: inset 0 0 0 2px var(--label); }
    .chips input:checked + span { background: var(--label); color: var(--bg); }
    .chips input:focus-visible + span { outline: 3px solid var(--secondary); outline-offset: 2px; }
    .countdown:empty { display: none; }
    .countdown { margin: 12px 4px 0; text-align: center; }
    .stepper { display: flex; align-items: center; justify-content: space-between; }
    .stepper button { width: 52px; height: 52px; padding: 0; font-size: 28px; line-height: 1;
                      background: var(--raised); color: var(--label); }
    .stepper label { font-size: 40px; font-weight: 800; gap: 0; }
    .stepper input[name=threshold] { width: 2.4em; text-align: right; background: none; padding: 0;
                                     font-weight: 800; -moz-appearance: textfield; }
    .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; }
    html:not(.js) .stepper [data-step] { visibility: hidden; }
    .save { display: block; margin: 16px auto 0; }
    .save[hidden] { display: none; }
  </style>
</head>
<body>
  <header class="bar">
    <nav class="segments" aria-label="Pages">
      <a href="{{ url_for('show_today') }}"{% if page == 'day' %} aria-current="page"{% endif %}>Day</a>
      <a href="{{ url_for('show_closet') }}"{% if page == 'closet' %} aria-current="page"{% endif %}>Closet</a>
      <a href="{{ url_for('show_settings') }}"{% if page == 'settings' %} aria-current="page"{% endif %}>Settings</a>
    </nav>
    {% if notice %}<p class="toast" role="status">{{ notice }}</p>{% endif %}
  </header>
  <main>
  {% block content %}<p>{{ message }}</p>{% endblock %}
  </main>
  <script>
    // Everything here enhances a page that already works without it:
    // see ADR-0013.
    const handOver = (side) => {
      try { sessionStorage.setItem("what2wear.from", side); } catch {}
    };

    const takeHandOver = () => {
      try {
        const side = sessionStorage.getItem("what2wear.from");
        sessionStorage.removeItem("what2wear.from");
        return side;
      } catch { return null; }
    };

    const isPopoverOpen = () => {
      try { return document.querySelector(":popover-open") !== null; } catch { return false; }
    };

    // The notice fades, and leaves the URL, so a reload doesn't show it again.
    const fadeToast = (toast) => {
      const url = new URL(location.href);
      url.searchParams.delete("notice");
      history.replaceState(history.state, "", url);
      setTimeout(() => toast.classList.add("gone"), 3000);
      toast.addEventListener("transitionend", () => toast.remove());
    };

    // A drag across the page moves a day, and across the strip a Week.
    // Each day is still its own URL, loaded whole with replace, so back
    // leaves the Day page rather than walking every day swiped past.
    const swipeDays = (day) => {
      const strip = day.querySelector(".week");
      const EDGE = 24;
      const SLOP = 10;
      const side = takeHandOver();
      if (side) day.classList.add(`from-${side}`);

      const go = (url, from) => { handOver(from); location.replace(url); };
      const move = (target, dx) => {
        target.style.transform = dx ? `translateX(${dx}px)` : "";
        target.style.opacity = dx ? 1 - Math.min(Math.abs(dx) / innerWidth, 1) * .6 : "";
      };

      let drag = null;
      let dragged = false;
      day.addEventListener("pointerdown", (event) => {
        if (event.clientX < EDGE || event.clientX > innerWidth - EDGE || isPopoverOpen()) return;
        const onStrip = event.target.closest(".week") !== null;
        drag = { x: event.clientX, y: event.clientY, dx: 0, axis: null,
                 target: onStrip ? strip : day, unit: onStrip ? "week" : "day" };
        dragged = false;
      });
      day.addEventListener("pointermove", (event) => {
        if (!drag) return;
        const dx = event.clientX - drag.x;
        const dy = event.clientY - drag.y;
        if (!drag.axis && Math.hypot(dx, dy) > SLOP) {
          drag.axis = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
          if (drag.axis === "x") { dragged = true; day.setPointerCapture(event.pointerId); }
        }
        if (drag.axis !== "x") return;
        drag.dx = dx;
        move(drag.target, dx);
      });
      day.addEventListener("pointerup", () => {
        if (!drag) return;
        const { target, dx, unit, axis } = drag;
        drag = null;
        if (axis !== "x") return;
        target.classList.add("snap");
        if (Math.abs(dx) > innerWidth / 4) {
          const next = dx < 0;
          target.style.transform = `translateX(${next ? -100 : 100}%)`;
          target.style.opacity = 0;
          const url = day.dataset[`${next ? "next" : "prev"}${unit === "week" ? "Week" : "Day"}`];
          setTimeout(() => go(url, next ? "right" : "left"), 180);
        } else {
          move(target, 0);
          setTimeout(() => target.classList.remove("snap"), 250);
        }
      });
      day.addEventListener("pointercancel", () => {
        if (drag) { drag.target.classList.add("snap"); move(drag.target, 0); }
        drag = null;
      });
      day.addEventListener("click", (event) => {
        const link = event.target.closest(".week a");
        const plain = event.button === 0 && !(event.metaKey || event.ctrlKey || event.shiftKey || event.altKey);
        if (!dragged && !(link && plain)) return;
        event.preventDefault();
        if (dragged) { dragged = false; return; }
        const on = new URL(link.href).pathname.split("/").pop();
        if (on !== day.dataset.on) go(link.href, on > day.dataset.on ? "right" : "left");
      }, true);
      addEventListener("pageshow", (event) => {
        if (!event.persisted) return;
        [day, strip].forEach((target) => { target.classList.remove("snap"); move(target, 0); });
      });
    };

    // Picking a date goes there, as the form's Go button does without script.
    const goOnPick = (picker) => {
      picker.addEventListener("change", () => {
        if (picker.value) picker.form.requestSubmit();
      });
    };

    // The Shirt sheet takes the menu's place rather than opening over it.
    const swapMenuForSheet = (opener) => {
      opener.addEventListener("click", (event) => {
        event.preventDefault();
        opener.closest("[popover]").hidePopover();
        document.getElementById(opener.getAttribute("popovertarget")).showPopover();
      });
    };

    // Replace redraws its art as the Colors change, painted by the same
    // rule as the icons module's get_art: a dark Color's tone is
    // lighter than it, and any other's darker.
    const getChannels = (color) => [1, 3, 5].map((at) => parseInt(color.slice(at, at + 2), 16));
    const mix = (color, other, amount) => {
      const ends = getChannels(other);
      return "#" + getChannels(color).map((start, at) =>
        Math.round(start + (ends[at] - start) * amount).toString(16).padStart(2, "0")).join("");
    };
    const getTone = (color) => {
      const [red, green, blue] = getChannels(color).map((channel) => channel / 255);
      const luminance = 0.2126 * red + 0.7152 * green + 0.0722 * blue;
      return luminance < 0.35 ? mix(color, "#ffffff", 0.62) : mix(color, "#000000", 0.42);
    };

    const drawLayer = (layer, paints) => {
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      const paint = layer.fill ?? layer.stroke;
      path.setAttribute("d", layer.d);
      path.setAttribute("fill", layer.fill ? paints[paint] ?? paint : "none");
      if (layer.stroke) {
        path.setAttribute("stroke", paints[paint] ?? paint);
        path.setAttribute("stroke-width", layer.width);
      }
      if (layer.alpha) path.setAttribute(layer.fill ? "fill-opacity" : "stroke-opacity", layer.alpha);
      return path;
    };

    const redrawOnEdit = (form, templates) => {
      const { color, striped, stripe_color: stripeColor } = form.elements;
      const svg = form.querySelector(".preview svg");
      form.addEventListener("input", () => {
        const paints = { color: color.value, stripe: stripeColor.value, tone: getTone(color.value),
                         button: mix(color.value, "#ffffff", 0.7) };
        svg.replaceChildren(...templates[form.dataset.art]
          .filter((layer) => striped.checked || (layer.fill ?? layer.stroke) !== "stripe")
          .map((layer) => drawLayer(layer, paints)));
      });
    };

    // Each card's Save shows once the card differs from how it loaded.
    // The weekdays' is enabled only at exactly three, and says why not.
    const saveWeekdaysOnChange = (form) => {
      const boxes = [...form.elements.weekday];
      const save = form.querySelector(".save");
      const countdown = form.querySelector(".countdown");
      const getTicks = () => boxes.map((box) => box.checked).join();
      const loaded = getTicks();
      const update = () => {
        const ticked = boxes.filter((box) => box.checked).length;
        save.hidden = getTicks() === loaded;
        save.disabled = ticked !== 3;
        countdown.textContent = save.hidden || ticked === 3 ? ""
          : ticked < 3 ? `Pick ${3 - ticked} more` : `Untick ${ticked - 3}`;
      };
      form.addEventListener("change", update);
      update();
    };

    // The stepper moves a whole degree a tap, within the field's limits.
    // A stored decimal shows rounded, and counts as a change to save.
    const saveThresholdOnStep = (form) => {
      const input = form.elements.threshold;
      const save = form.querySelector(".save");
      const loaded = form.dataset.stored;
      const update = () => { save.hidden = input.value === loaded; };
      form.querySelectorAll("[data-step]").forEach((button) => {
        button.addEventListener("click", () => {
          const stepped = Math.round(Number(input.value)) + Number(button.dataset.step);
          input.value = Math.min(Math.max(stepped, Number(input.min)), Number(input.max));
          update();
        });
      });
      input.addEventListener("input", update);
      update();
    };

    const toast = document.querySelector(".toast");
    if (toast) fadeToast(toast);
    const day = document.querySelector(".day");
    if (day) swipeDays(day);
    document.querySelectorAll(".toolbar input[type=date]").forEach(goOnPick);
    document.querySelectorAll("[popover] [popovertarget]").forEach(swapMenuForSheet);
    const artTemplates = document.getElementById("art-templates");
    if (artTemplates) {
      const templates = JSON.parse(artTemplates.textContent);
      document.querySelectorAll("form[data-art]").forEach((form) => redrawOnEdit(form, templates));
    }
    // A refused Replace comes back with its sheet to reopen.
    document.querySelector(".sheet[data-open]")?.showPopover();
    document.querySelectorAll("form.weekdays").forEach(saveWeekdaysOnChange);
    document.querySelectorAll("form.threshold").forEach(saveThresholdOnStep);
  </script>
</body>
</html>
