# An example wardrobe, hand-authored. Copy it to the path the tool
# names on its first run and make it yours; the tool reads this file
# and never writes it.

# Which weekdays are office days. Everything else, weekends included, is a home day.
office_weekdays: [mon, wed, fri]

office:
  # The date, and the shirt worn on it. Every position is counted from here.
  anchor: { date: 2026-08-17, shirt: sateen }
  shirts:
    - { name: poplin, pants: sand }
    - { name: twill, pants: slate }
    - { name: flannel, pants: moss }
    - { name: gingham, pants: sand }
    - { name: sateen, pants: slate }
  # What goes with each pants color, one row per color rather than one
  # per shirt. The fallback is the sweater to take when the primary is
  # already worn this week; it is always another row's primary, so that
  # row's shoes come along with it. Moss needs none: flannel is the only
  # shirt with moss pants, so it can never collide.
  pants:
    sand: { sweater: cream, shoes: walnut, fallback: ash }
    slate: { sweater: ink, shoes: ebony, fallback: ash }
    moss: { sweater: ash, shoes: bone }

home:
  anchor: { date: 2026-08-15, shirt: pique }
  shirts:
    - { name: poplin, pants: sand }
    - { name: henley, pants: moss }
    - { name: jersey, pants: slate }
    - { name: twill, pants: sand }
    - { name: waffle, pants: moss }
    - { name: sateen, pants: slate }
    - { name: rugby, pants: sand }
    - { name: flannel, pants: moss }
    - { name: pique, pants: slate }
  # No fallback here -- home has no no-repeat rule -- and sand and slate
  # deliberately share ebony shoes.
  pants:
    sand: { sweater: mustard, jacket: bomber, shoes: ebony }
    slate: { sweater: indigo, jacket: peacoat, shoes: ebony }
    moss: { sweater: oatmeal, jacket: peacoat, shoes: bone }
